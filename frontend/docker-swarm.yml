services:
  agentfromscratch-ui:
    image: agentfromscratch-ui:local
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        agent-src: ../AgentFromScratch
    env_file:
      - ../AgentFromScratch/.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      AGENT_BIN_PATH: /opt/AgentFromScratch/bin/agent
      AGENT_PROJECT_DIR: /opt/AgentFromScratch
      AGENT_RUN_DIR: /data/afs-runs
      AGENT_AUDIT_LOG: /data/afs.jsonl
      AGENT_WORKFLOW_RUN_DIR: /data/afs-wf
      AGENT_WORKFLOW_AUDIT_LOG: /data/afs-wf.jsonl
      AGENT_MEMORY_DIR: /opt/AgentFromScratch/artifacts/memory
      UV_CACHE_DIR: /data/uv-cache
    ports:
      - "3000:3000"
    volumes:
      - afs-data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  afs-data:
